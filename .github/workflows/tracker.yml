name: AMC IMAX Ticket Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run NYC Tracker
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python NYC_seat_watcher_actions.py

      - name: Commit updated state file (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_nyc.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update NYC state [skip ci]"

          for i in {1..5}; do
            echo "Push attempt $i/5..."

            if git pull --rebase origin main && git push; then
              echo "Push successful!"
              exit 0
            fi

            echo "Push/rebase failed. Retrying..."
            sleep $((RANDOM % 5 + 2))
          done

          echo "Failed to push after 5 attempts."
          exit 1